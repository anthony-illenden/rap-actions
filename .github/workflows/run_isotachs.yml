name: Update RAP isotachs Plots

on:
  push:
  schedule:
    - cron: '*/30 * * * *'  

jobs:
  update_isotachs_plots:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2
    
      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.9.18'
    
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install matplotlib metpy==1.6.2 siphon==0.9 cartopy protobuf==3.20.3 numpy==1.26.4 netCDF4==1.5.7
    
      - name: Delete old plots if they exist
        run: |
          find plots/250/ -name '*.png' -exec rm {} +
    
      - name: Run isotachs.py script
        run: python isotachs.py
    
      - name: Commit and push changes
        run: |
          git config --local user.name "${{ secrets.GIT_USER_NAME }}"
          git config --local user.email "${{ secrets.GIT_USER_EMAIL }}"
          git add plots/isotachs/*.png
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update RAP Isotachs Plots"
            git push origin main
          fi
